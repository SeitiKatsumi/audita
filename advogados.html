<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Advogados | Audita</title><link rel="icon" href="/assets/audita-logo-original.png">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#172d39;font:16px system-ui,sans-serif}main{max-width:1100px;margin:0 auto;padding:32px 20px}header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:32px}header img{background:#172d39;padding:8px;border-radius:9px}h1{font-size:28px;margin:8px 0}h2{font-size:20px}p{line-height:1.6}small{color:#526671}section,article{background:white;border:1px solid #dbe3e8;border-radius:14px;padding:24px;margin-bottom:16px}#login{max-width:420px;margin:60px auto}label{display:block;margin:16px 0}input{display:block;width:100%;padding:12px;border:1px solid #9dacb5;border-radius:7px;font:inherit;margin-top:6px}button,.download{display:inline-block;border:0;border-radius:7px;background:#146b57;color:white;padding:12px 16px;font:inherit;cursor:pointer;text-decoration:none}button:disabled{opacity:.6;cursor:wait}.secondary{background:#e8edf1;color:#172d39}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #c18d28;outline-offset:3px}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.badge{font-size:13px;background:#e6f3ed;padding:5px 9px;border-radius:20px}#message{color:#a12626;white-space:pre-wrap}#message:empty{display:none}[hidden]{display:none!important}.protocol{max-width:500px}nav{display:flex;gap:8px;flex-wrap:wrap}nav button[aria-pressed=true]{background:#172d39;color:white}@media(max-width:600px){header{align-items:flex-start;flex-direction:column}main{padding:20px 14px}article,section{padding:18px}}
  </style>
</head>
<body><main>
  <header><div><a href="/" aria-label="Audita, início"><img src="/assets/audita-logo-original.png" alt="Audita" width="110"></a><h1>Painel dos advogados</h1><small>Solicitações de cobrança indevida · Itaú</small></div><button id="logout" class="secondary" hidden>Sair</button></header>
  <p id="message" role="alert"></p>
  <section id="login"><h2>Entre na sua conta</h2><p>Acesso para advogados autorizados pela Audita.</p><form id="loginForm"><label>E-mail<input name="email" type="email" autocomplete="username" required></label><label>Senha<input name="password" type="password" autocomplete="current-password" required></label><button type="submit">Entrar</button></form></section>
  <div id="dashboard" hidden><section><h2 id="welcome"></h2><p>Assuma uma solicitação para acessar os documentos. Após a revisão e o protocolo no tribunal, registre o número recebido.</p><nav aria-label="Filtrar solicitações"><button data-filter="queued" aria-pressed="true">Na fila</button><button data-filter="claimed" class="secondary" aria-pressed="false">Meus atendimentos</button><button data-filter="filed" class="secondary" aria-pressed="false">Protocolados</button><button id="refresh" class="secondary">Atualizar</button></nav></section><div id="jobs" aria-live="polite"></div></div>
</main><script type="module" src="/advogados.js"></script></body></html>
